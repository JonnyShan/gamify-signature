<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Jonny Shannon — Gamify signature</title>
<style>
  body{margin:0;background:#fff;}
  .sig{font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;padding:22px 26px;color:#1a1a1a;}
  .warm{font-size:12px;color:#111;margin:0 0 13px;}
  .dots{margin:0 0 18px;font-size:0;}
  .dots span{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;}
  .card{border-collapse:collapse;}
  .card td{vertical-align:middle;}
  .photo img{display:block;width:120px;height:120px;border-radius:50%;object-fit:cover;}
  .bar{padding:0 19px;}
  .bar img{display:block;width:3px;height:120px;border-radius:2px;object-fit:cover;}
  .name{font-size:22px;font-weight:700;color:#1a1a1a;letter-spacing:-.24px;line-height:1.05;}
  .title{font-size:13px;font-weight:600;color:#4e80ee;margin-top:4px;}
  .contact{margin-top:13px;font-size:12px;line-height:1.62;color:#6c727f;}
  .contact a{color:#6c727f;text-decoration:none;}
  .social{margin-top:11px;font-size:0;}
  .social a{display:inline-block;margin-right:8px;line-height:0;}
  .social img{width:22px;height:22px;display:block;border:0;}
</style>
</head>
<body>
  <div class="sig">
    <div class="warm">Warm Regards,</div>

    <div class="dots">
      <span style="background:#dd524c"></span>
      <span style="background:#e9a23b"></span>
      <span style="background:#5ec269"></span>
      <span style="background:#4e80ee"></span>
      <span style="background:#9d59ef"></span>
    </div>

    <table class="card" cellpadding="0" cellspacing="0">
      <tr>
        <td class="photo"><img src="https://cdn.jsdelivr.net/gh/JonnyShan/gamify-signature@main/jonny_photo.png" alt="Jonny Shannon"></td>
        <td class="bar"><img src="https://cdn.jsdelivr.net/gh/JonnyShan/gamify-signature@main/rainbow_bar.png" alt=""></td>
        <td class="info">
          <div class="name">Jonny Shannon</div>
          <div class="title">Account Executive&nbsp; • &nbsp;Gamify</div>
          <div class="contact">
            <a href="mailto:john@gamify.com">john@gamify.com</a><br>
            <a href="https://gamify.com">gamify.com</a><br>
            <span>56 Bowman St, Pyrmont Sydney 2009</span>
          </div>
          <div class="social">
            <a href="https://www.facebook.com/Gamify/" aria-label="Facebook"><img src="https://cdn.jsdelivr.net/gh/JonnyShan/gamify-signature@main/fb.png" width="22" height="22" alt="Facebook" style="display:block;border:0;width:22px;height:22px;"></a>
            <a href="https://www.linkedin.com/company/gamify/posts/?feedView=all" aria-label="LinkedIn"><img src="https://cdn.jsdelivr.net/gh/JonnyShan/gamify-signature@main/li.png" width="22" height="22" alt="LinkedIn" style="display:block;border:0;width:22px;height:22px;"></a>
            <a href="https://www.youtube.com/@GamifyChannel" aria-label="YouTube"><img src="https://cdn.jsdelivr.net/gh/JonnyShan/gamify-signature@main/yt.png" width="22" height="22" alt="YouTube" style="display:block;border:0;width:22px;height:22px;"></a>
          </div>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
